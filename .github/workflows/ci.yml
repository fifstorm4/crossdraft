# Every push runs the checks that need no SageMath, which is most of them.
#
# The split matters: `selftest --level quick` cross-checks this toolchain
# against Digital's own simulator and needs only a JDK, so it can run on
# every commit in about two minutes. The analysis suites need CLAASP and go
# in the Docker job, which runs on tags.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  bridge:
    name: netlist extractor and cross-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Digital
        run: |
          curl -sL -o Digital.zip \
            https://github.com/hneemann/Digital/releases/latest/download/Digital.zip
          unzip -q Digital.zip -d /opt
          echo "DIGITAL_JAR=/opt/Digital/Digital.jar" >> "$GITHUB_ENV"

      - name: Build the extractor
        run: |
          cd java && make DIGITAL_JAR="$DIGITAL_JAR"
          echo "BRIDGE_JAR=$PWD/digbridge.jar" >> "$GITHUB_ENV"

      # Digital's simulator is the oracle here, so a pass means the two
      # agree on this runner -- not that they agreed on the author's laptop.
      - name: Cross-validation
        run: python3 python/digcli.py selftest --level quick

      - name: Randomised circuits
        run: |
          python3 tests/test_fuzz.py \
            --digital-jar "$DIGITAL_JAR" --bridge-jar "$BRIDGE_JAR" \
            --cases 40 --seed ${{ github.run_number }}

      # A different seed every run, so the search widens over time instead
      # of re-checking the same forty circuits forever.

  image:
    name: container image
    needs: bridge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The digest is what a paper should quote, so print it where the
      # release notes can pick it up.
      - name: Digest
        run: |
          echo "Quote this in the paper's methodology section:"
          echo "  ghcr.io/${{ github.repository }}@${{ steps.meta.outputs.digest }}"
