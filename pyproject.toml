[project]
name = "crossdraft"
version = "0.1.0"
description = "Draw a cipher once in Digital; check it against its test vectors and analyse it with CLAASP."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["cryptanalysis", "block-cipher", "differential-cryptanalysis",
            "sat", "reproducible-research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Security :: Cryptography",
  "Programming Language :: Python :: 3",
]

# The core -- drawing a cipher and checking it against its test vectors --
# needs nothing but the standard library and a JVM to run Digital.jar. The
# heavy stack is only for analysis, which is why it is an extra rather than a
# requirement: a user's first hour is spent drawing and verifying, and that
# hour should not begin with a SageMath install.
dependencies = []

[project.optional-dependencies]
analysis = ["claasp"]          # also needs SageMath, kissat, espresso
figures = ["matplotlib"]       # only for .pdf/.png/.jpg export

[project.urls]
Homepage = "https://github.com/fifstorm4/crossdraft"
Issues = "https://github.com/fifstorm4/crossdraft/issues"

# No [project.scripts] and no [tool.setuptools]: this is metadata, not an
# installable package. The modules import each other flatly (`from javacp
# import classpath`), there is no python/__init__.py, and `pip install .`
# would produce something that imports but does not run.
#
# Run it in place instead:
#
#     python3 python/digcli.py build present
#
# or through Docker, which is what the launchers do. Packaging would buy
# `pip install -e .` and nothing else; git clone and a container already
# cover every way this is actually used.
