# Checks that need no SageMath run on every push, on Linux and on Windows.
#
# Windows is not decoration. Every failure this project has hit on a user's
# machine was Windows-specific and lived in run.ps1 or the workflow around
# it: PowerShell splitting an unquoted 6,7,8,9 into four arguments, a
# downloaded script blocked by the zone marker, a stale image serving code
# the checkout had already replaced. None could be reproduced on Linux, and
# each cost a round trip to a person to find. Running the real thing on real
# Windows moves that into CI.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  crosscheck:
    name: cross-validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Digital (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL -o Digital.zip \
            https://github.com/hneemann/Digital/releases/latest/download/Digital.zip
          unzip -q Digital.zip -d "$HOME"
          echo "DIGITAL_JAR=$HOME/Digital/Digital.jar" >> "$GITHUB_ENV"

      - name: Fetch Digital (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri https://github.com/hneemann/Digital/releases/latest/download/Digital.zip -OutFile Digital.zip
          Expand-Archive Digital.zip -DestinationPath $HOME
          "DIGITAL_JAR=$HOME\Digital\Digital.jar" >> $env:GITHUB_ENV

      - name: Build the extractor
        run: |
          javac -cp "${{ env.DIGITAL_JAR }}" -d java/build java/src/digbridge/DigNetlist.java
          jar cf java/digbridge.jar -C java/build .
        shell: bash

      - name: Record the bridge path
        run: echo "BRIDGE_JAR=$(pwd)/java/digbridge.jar" >> "$GITHUB_ENV"
        shell: bash

      # Digital's own simulator is the oracle, so a pass says the two agree
      # on this runner rather than on the author's machine.
      - name: Cross-validation against Digital
        run: python tests/test_all.py --digital-jar "$DIGITAL_JAR" --bridge-jar "$BRIDGE_JAR"
        shell: bash

      # A different seed each run, so the search widens over time instead of
      # re-checking the same circuits forever.
      - name: Randomised circuits
        run: |
          python tests/test_fuzz.py --digital-jar "$DIGITAL_JAR" \
            --bridge-jar "$BRIDGE_JAR" --cases 30 --seed ${{ github.run_number }}
        shell: bash

      # Speaks to the server over a socket, which is the only way the
      # bind-address bug was ever going to show up.
      - name: GUI serves and its stages run
        run: |
          python tests/test_gui.py --digital-jar "$DIGITAL_JAR" \
            --bridge-jar "$BRIDGE_JAR" --rounds 2 --skip-analyse
        shell: bash

  launcher:
    name: run.ps1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Parse and dry-run the launcher against a stubbed docker, so its
      # argument handling is checked without needing a container. This is
      # where the Windows bugs were.
      - name: Parse run.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD/run.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.Message }; exit 1 }
          "run.ps1 parses"

      - name: Dry-run against a stubbed docker
        shell: pwsh
        run: |
          $stub = Join-Path $PWD "stub"
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          $ext = if ($IsWindows) { ".bat" } else { "" }
          $body = if ($IsWindows) {
            "@echo off`r`nif `"%1`"==`"images`" echo sha256:stub`r`nif `"%1`"==`"inspect`" echo 2099-01-01T00:00:00.000000000Z`r`nif `"%1`"==`"run`" echo STUB-RUN %*`r`n"
          } else {
            "#!/bin/sh`ncase `"`$1`" in`n images) echo sha256:stub ;;`n inspect) echo 2099-01-01T00:00:00.000000000Z ;;`n run) echo STUB-RUN `$* ;;`nesac`n"
          }
          Set-Content -Path (Join-Path $stub "docker$ext") -Value $body -NoNewline
          if (-not $IsWindows) { chmod +x (Join-Path $stub "docker") }
          $env:PATH = "$stub" + [IO.Path]::PathSeparator + $env:PATH

          $out = & "$PWD/run.ps1" bound present --weights 6 7 8 9 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "STUB-RUN") { throw "run.ps1 did not reach docker run" }
          if ($out -notmatch "6 7 8 9") { throw "arguments were mangled on the way through" }
          "run.ps1 passes its arguments through intact"

  image:
    name: container image
    needs: [crosscheck, launcher]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Digest
        run: |
          echo "Quote this in the paper's methodology section:"
          echo "  ghcr.io/${{ github.repository }}@${{ steps.meta.outputs.digest }}"
